name: Production smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for the Cloudflare deployment
        shell: bash
        run: |
          endpoint="https://shimamura-export-scout-live.y-shoshi49.workers.dev"
          for attempt in {1..36}; do
            health="$(curl --fail --silent --show-error --max-time 15 "$endpoint/api/health" || true)"
            if [[ "$health" == *'"build":"browser-import-v1"'* ]]; then
              echo "$health"
              exit 0
            fi
            echo "Waiting for deployment ($attempt/36)"
            sleep 10
          done
          echo "Timed out waiting for build=browser-import-v1"
          exit 1

      - name: Verify browser import validation
        shell: bash
        run: |
          endpoint="https://shimamura-export-scout-live.y-shoshi49.workers.dev"
          status="$(curl --silent --show-error --max-time 30 \
            --output import-result.json --write-out '%{http_code}' \
            --request POST "$endpoint/api/browser-import" \
            --header 'content-type: application/json' \
            --header 'origin: chrome-extension://production-smoke' \
            --data '{"products":[]}')"
          test "$status" = "400"
          grep --quiet 'no valid online products' import-result.json

      - name: Verify D1 and flyer cleanup
        shell: bash
        run: |
          endpoint="https://shimamura-export-scout-live.y-shoshi49.workers.dev"
          curl --fail --silent --show-error --max-time 30 \
            "$endpoint/api/state" --output state-result.json
          node --input-type=module -e '
            import fs from "node:fs";
            const data = JSON.parse(fs.readFileSync("state-result.json", "utf8"));
            const flyerCandidates = (data.candidates || []).filter((row) =>
              String(row.source_name || "").includes("チラシ") ||
              String(row.title_ja || "").includes("チラシ")
            );
            console.log(JSON.stringify({
              persistence: data.persistence,
              totalCandidates: data.candidates.length,
              flyerCandidates: flyerCandidates.length,
            }));
            if (!data.persistence || flyerCandidates.length !== 0) process.exit(1);
          '
